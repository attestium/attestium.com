name: Build Whitepaper

on:
  push:
    paths:
      - 'whitepaper/**'
  pull_request:
    paths:
      - 'whitepaper/**'

permissions:
  contents: read

jobs:
  # Builds with pandoc, LaTeX and mermaid-filter (and the Chromium it
  # drives) without write access; only the commit job below may push.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-xetex texlive-latex-extra texlive-fonts-recommended \
            fonts-dejavu librsvg2-bin

      - name: Install mermaid-filter
        run: npm install -g mermaid-filter@1.4.7

      - name: Build PDF
        working-directory: whitepaper
        run: make pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: attestium-whitepaper
          path: whitepaper/output/attestium-whitepaper.pdf
          if-no-files-found: error

  commit:
    name: Commit the PDF
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: whitepaper-commit
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: attestium-whitepaper
          path: .

      - name: Commit PDF to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add attestium-whitepaper.pdf
          git diff --cached --quiet || git commit -m "chore: rebuild whitepaper PDF [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
