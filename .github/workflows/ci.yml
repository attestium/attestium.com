name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
      - run: npm install -g pnpm@9
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec xo lib test examples

  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      # A software TPM and tpm2-tools let the TPM and IMA tests run against
      # a real TPM 2.0 implementation instead of mocks.
      - name: Install swtpm, tpm2-tools and gpg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends swtpm swtpm-tools tpm2-tools gnupg openssl perl

      - run: npm install -g pnpm@9
      - run: pnpm install --frozen-lockfile

      # The container tests run this image and serve it from a local registry.
      - name: Pull the test image
        run: docker pull alpine:3.20

      # c8 enforces 100% statement, branch, function and line coverage of
      # lib/. The tests run as root, as the attester does: some need other
      # users' files, a chroot, containers or other users' processes.
      - name: Test with coverage
        run: sudo env "PATH=$PATH" pnpm run coverage

      - name: Upload coverage
        if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: coverage/

      - name: Coveralls
        if: matrix.node-version == '22.x'
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage/lcov.info

  # macOS and Windows: tests of Linux features (/proc, containers, TPM)
  # skip, and on Windows so do tests of POSIX files and Unix tools.
  platforms:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
      - run: npm install -g pnpm@9
      - run: pnpm install --frozen-lockfile
      - run: node --test

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
      - run: npm install -g pnpm@9
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=moderate
